name: Sync index.html

# Keeps index.html identical to "150K Combine tracker.html" on every push.
on:
  push:
    paths:
      - "150K Combine tracker.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy tracker to index.html
        run: cp "150K Combine tracker.html" index.html

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync index.html from 150K Combine tracker.html"
          git push
